<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Outreach</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="app">
    <header>
      <div class="bar1">
        <div class="brand"><span id="dot" class="dot" title="Local server"></span>Outreach</div>
        <button id="teamchip" class="chip-team" title="Team sync status">Team</button>
        <span class="spacer"></span>
        <select id="account" class="compact" title="Account" hidden></select>
        <button id="keys" class="iconbtn" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts">⌨</button>
        <button id="theme" class="iconbtn" title="Light / dark" aria-label="Switch light or dark">◐</button>
      </div>
      <nav aria-label="Sections">
        <button data-tab="today" class="on">Today <span class="badge hot" id="b-today"></span></button>
        <button data-tab="pipeline">Replies <span class="badge" id="b-pipeline"></span></button>
        <button data-tab="jobs">Jobs <span class="badge" id="b-jobs"></span></button>
        <button data-tab="team">Team <span class="badge" id="b-team"></span></button>
        <button data-tab="stats">Stats</button>
        <button data-tab="settings">Settings</button>
      </nav>
    </header>
    <main>
      <section id="today"></section>
      <section id="pipeline" hidden></section>
      <section id="jobs" hidden></section>
      <section id="team" hidden></section>
      <section id="stats" hidden></section>
      <section id="settings" hidden></section>
    </main>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <script src="sidepanel.js"></script>
</body>
</html>
